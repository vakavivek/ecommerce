<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { max-width: 1100px; margin: 32px auto; padding: 0 20px; font-family: Arial, sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        #search-form { display: flex; gap: 8px; }
        #search-input { padding: 10px; }
        #product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
        .thumb { display: grid; place-items: center; height: 90px; background: #f2f2f2; font-size: 32px; }
        .brand, .stock { color: #666; margin-top: 10px; }
        .name { font-weight: bold; margin-top: 8px; }
        .desc { margin-top: 8px; }
        .price { font-weight: bold; margin-top: 12px; }
        .card button { margin-top: 12px; padding: 9px 14px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        #cart-toggle, #logout-button { padding: 10px 14px; }
        #cart-panel { margin-top: 24px; }
        .cart-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 20px; padding: 14px 0; border-bottom: 1px solid #ddd; }
        .cart-item p { margin-bottom: 0; color: #666; }
        .cart-controls { display: flex; align-items: center; gap: 10px; }
        .cart-controls button { padding: 6px 10px; }
        .cart-controls .remove-item { margin-left: 8px; }
        #cart-summary { margin-top: 18px; font-size: 1.2rem; font-weight: bold; text-align: right; }
        #message.error { color: #b00020; }
        @media (max-width: 600px) { header { align-items: flex-start; flex-direction: column; } #search-form { width: 100%; } #search-input { flex: 1; min-width: 0; } }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>My Store</h1>
        </div>
        <div class="header-actions">
            <button id="cart-toggle" type="button" aria-expanded="false">Cart (<span id="cart-count">0</span>)</button>
            <button id="logout-button" type="button">Log out</button>
        </div>
    </header>
    <p id="message" role="status"></p>
    <section id="store-view">
        <p id="heading">All products</p>
        <form id="search-form">
            <input id="search-input" type="search" placeholder="Search products">
            <button type="submit">Search</button>
        </form>
        <main id="product-grid"></main>
    </section>
    <section id="cart-panel" hidden>
        <h2>Your cart</h2>
        <div id="cart-items"></div>
        <p id="cart-summary"></p>
    </section>
    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
